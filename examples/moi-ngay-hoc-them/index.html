<div id="stage"></div>
<script>
const SPEC = JSON.parse(document.getElementById('spec').textContent), LINES = JSON.parse(document.getElementById('script-json').textContent).lines;
const [W, H] = SPEC.size, T = SPEC.theme, DUR = SPEC.dur, FPS = SPEC.fps, WORDS = window.WORDS || {}, FOOT = window.FOOTAGE || {};
const B = VP.clock(SPEC.bpm), { clamp, lerp, ease } = VP;
const stage = document.getElementById('stage'); stage.style.cssText += `width:${W}px;height:${H}px;--accent:${T.accent}`;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const pending = [];                       // frame decodes the renderer must wait for (never await rAF)

/* ---------- clips ---------- */
SPEC.clips.forEach((c, i) => {
  const el = document.createElement('div'); el.className = 'clip'; el.style.zIndex = i + 1;
  const ph = `<div class="ph" style="background:linear-gradient(165deg,hsl(${c.hue} 45% 30%),hsl(${c.hue + 25} 50% 14%))"><span>${esc(c.label)}<br><small style="font-weight:500;opacity:.7">chờ clip “${c.id}”</small></span></div>`;
  if (!FOOT[c.id] && window.SCENES && SCENES[c.id]) { el.innerHTML = '<div class="sc"></div>'; c.scene = mountScene(c.id, el.firstElementChild); } else el.innerHTML = FOOT[c.id] ? '<img alt="">' : ph; c.el = el; c.media = el.firstElementChild; c.url = null; stage.appendChild(el);
});
stage.insertAdjacentHTML('beforeend', '<div id="shade"></div><div id="title"></div><div id="cap"></div><div id="endc"></div>');
const titleEl = document.getElementById('title'), capEl = document.getElementById('cap'), endEl = document.getElementById('endc');
function clips(t) {
  SPEC.clips.forEach((c, i) => {
    const xf = SPEC.xfade, a = i ? clamp((t - c.t0) / xf) : 1, on = t >= c.t0 - .001 && t < c.t1 + xf;
    c.el.style.display = on ? 'block' : 'none'; if (!on) return;
    c.el.style.opacity = ease(a).toFixed(3);
    const k = clamp((t - c.t0) / (c.t1 - c.t0 + xf)); const pn = c.pan || [0, 0], z = 1 + (c.zoom != null ? c.zoom : SPEC.push) * k; c.media.style.transform = `translate(${(pn[0] * k * W / 100).toFixed(1)}px,${(pn[1] * k * H / 100).toFixed(1)}px) scale(${z.toFixed(4)})`;
    if (c.scene) c.scene.draw(Math.max(0, t - c.t0), c.t1 - c.t0 + xf);
    const f = FOOT[c.id]; if (f) { const idx = Math.max(1, Math.min(f.n, Math.floor((t - c.t0) * f.fps) + 1)), url = `footage/${c.id}/${String(idx).padStart(5, '0')}.jpg`;
      if (c.url !== url) { c.url = url; c.media.src = url; pending.push(c.media.decode().catch(() => { })); } }
  });
}

/* ---------- title ---------- */
function title(t) { const o = SPEC.title, a = VP.spring(t - o.in, 1.6, .8) * (1 - clamp((t - o.out) / .5));
  titleEl.style.opacity = clamp(a).toFixed(3); titleEl.style.transform = `translateY(${((1 - clamp(a)) * 26).toFixed(1)}px)`;
  if (!titleEl.firstChild) titleEl.innerHTML = esc(o.text) + '<i></i>'; titleEl.firstElementChild.style.width = (clamp(VP.spring(t - o.in - .25, 1.4, .9)) * 220).toFixed(1) + 'px'; }

/* ---------- captions: word timings from words.js when present, else spread by word count (estimate) ---------- */
const nrm = s => s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
const PAGES = [];
LINES.forEach((L, i) => {
  const toks = L.text.split(' '), nextT = LINES[i + 1] ? LINES[i + 1].t : DUR - 3.6; let w = WORDS[L.id];
  if (w) w = w.map(x => [x[0], L.t + x[1], L.t + x[2]]);
  else { const d = Math.min(toks.length / 2.5, nextT - L.t - .15), step = d / toks.length; w = toks.map((x, k) => [x, L.t + k * step, L.t + (k + 1) * step]); }
  let cur = []; w.forEach((x, k) => { cur.push(x); const last = k === w.length - 1, brk = /[,.!?]$/.test(x[0]) && cur.length >= 3; if (last || brk || cur.length >= 5) { PAGES.push(cur); cur = []; } });
});
let pageIdx = -2;
function captions(t) {
  let p = -1; for (let i = 0; i < PAGES.length; i++) { const pg = PAGES[i]; if (t >= pg[0][1] - .08 && t < pg[pg.length - 1][2] + .22) { p = i; } }
  if (p !== pageIdx) { pageIdx = p; capEl.innerHTML = p < 0 ? '' : PAGES[p].map(x => `<span class="w">${esc(x[0])}</span>`).join(' '); }
  if (p < 0) { capEl.style.opacity = 0; return; }
  const pg = PAGES[p], a = VP.spring(t - (pg[0][1] - .08), 2.4, .78);
  capEl.style.opacity = clamp(a * 3).toFixed(3); capEl.style.transform = `translateY(${((1 - clamp(a)) * 22).toFixed(1)}px)`;
  capEl.querySelectorAll('.w').forEach((e, k) => { const x = pg[k]; e.className = 'w' + (t >= x[2] ? ' done' : t >= x[1] ? ' on' : ''); });
}

/* ---------- end message ---------- */
(() => { const o = SPEC.end, ws = o.text.split(' '), acc = o.accent || [];
  endEl.innerHTML = `<div class="t">${ws.map(w => `<span class="m${acc.some(a => a.split(' ').includes(w)) ? ' a' : ''}"><span>${esc(w)}</span></span>`).join(' ')}</div><div class="bar"></div>`; })();
function endCard(t) { const o = SPEC.end, k = clamp((t - o.t) / .6); endEl.style.display = t >= o.t - .01 ? 'flex' : 'none'; if (t < o.t - .01) return;
  endEl.style.background = `rgba(8,14,6,${(.8 * ease(k)).toFixed(3)})`; capEl.style.display = 'none';
  endEl.querySelectorAll('.m>span').forEach((s, i) => { const v = VP.spring(t - o.t - .25 - i * .13, 2.2, .72); s.style.transform = `translateY(${((1 - clamp(v)) * 105).toFixed(2)}%)`; });
  endEl.querySelector('.bar').style.width = (clamp(VP.spring(t - o.t - 1.9, 1.4, .9)) * 240).toFixed(1) + 'px'; }

function frame(t) { capEl.style.display = ''; clips(t); title(t); captions(t); endCard(t);
  stage.style.opacity = (1 - clamp((t - (DUR - 1.2)) / 1.2)).toFixed(3); }
VP.boot({ seek: frame, dur: DUR, cues: () => [], fonts: ['800 60px "Be Vietnam Pro"', '500 40px "Be Vietnam Pro"'] });
{ const base = window.seek; window.seek = async t => { pending.length = 0; await base(t); await Promise.all(pending); }; }
window.SIZE = [W, H]; window.BPM = SPEC.bpm; window.B = B;
window.AUDIT = { beats: [1.2, 6, 10, 16, 21, 26, 31, 36, 40, 45, 50, 55, 60, 65], safe: [60, 220, 970, 1540], minFont: 26, ignore: ['.ph'] };
