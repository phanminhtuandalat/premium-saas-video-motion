<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Kinh tế Việt Nam 9 tháng 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=block" rel="stylesheet">
<script src="../../engine/motion.js"></script>
<script src="data.js"></script>
<script src="words.js"></script>
<!--
  KINH TẾ VIỆT NAM 9 THÁNG 2026 — video dữ liệu 9:16, kiểu Keynote, giọng đọc dẫn nhịp.
  Mốc thời gian (đơn vị: beat, 1 beat = 60/bpm giây) nằm trong <script id="spec">:
    vo      = beat bắt đầu của từng câu giọng đọc (tools đọc lại để ghép âm thanh — một nguồn duy nhất)
    scenes  = [id, beat bắt đầu cảnh, kiểu vào]
  Nhạc: corporate-drive-100bpm (99,596 BPM). Số liệu: nội dung do người dùng cung cấp.
-->
<script id="spec" type="application/json">
{ "bpm": 99.596, "dur": 108, "captions": true,
  "vo": { "s1a": 2, "s1b": 12, "s2": 17, "s3": 24, "s4": 37, "s5": 51, "s6": 64, "s7": 76, "s8": 87 },
  "scenes": [["s1", 0, "none"], ["s2", 16, "rise"], ["s3", 23, "iris"], ["s4", 36, "push"], ["s5", 50, "zoom"], ["s6", 63, "rise"], ["s7", 75, "push"], ["s8", 86, "iris"]] }
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#000}
#stage{position:relative;overflow:hidden;width:1080px;height:1920px;font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;will-change:transform}
.a{position:absolute}
.roll{position:relative;overflow:hidden}
.roll>div{will-change:transform;white-space:nowrap}
.mask{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.16em .03em .16em;margin:-.16em 0}
.mask>span{display:inline-block;will-change:transform}
.num{font-family:Archivo,'Be Vietnam Pro',sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.hd{font-weight:800;letter-spacing:-.025em;line-height:1.1}
.grad{background-image:linear-gradient(100deg,#FFB020,#FF5A3C);-webkit-background-clip:text;background-clip:text;color:transparent}
.teal{background-image:linear-gradient(100deg,#19C3A6,#3BD9B8);-webkit-background-clip:text;background-clip:text;color:transparent}
.kick{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:34px;text-align:center}
svg{overflow:visible}
.capi{display:inline-block;padding:14px 30px 16px;border-radius:32px;background:rgba(10,13,20,.82);font-size:46px;font-weight:700;line-height:1.3;color:rgba(255,255,255,.5);text-align:center}
.cw.on{color:#fff}.cw.cur{color:#FFB020}
</style></head><body>
<div id="stage"></div>
<script>
const SPEC = JSON.parse(document.getElementById('spec').textContent);
const W = 1080, H = 1920, V = SPEC.vo;
const B = VP.clock(SPEC.bpm);
const { sp, ramp, clamp, lerp, SPR } = VP;
const C = { ink: '#0A0D14', paper: '#F3F1EC', fg: '#F5F5F7', dk: '#101218', mutedL: '#9AA0AB', mutedD: '#6B6F78', a1: '#FFB020', a2: '#FF5A3C', teal: '#19C3A6' };
const GR = 'linear-gradient(100deg,#FFB020,#FF5A3C)', GR90 = 'linear-gradient(90deg,#FFB020,#FF5A3C)', TL = 'linear-gradient(90deg,#19C3A6,#3BD9B8)';
const stage = document.getElementById('stage');

/* ---------- helpers ---------- */
const mk = (p, css, html = '', cls = '') => { const d = document.createElement('div'); if (cls) d.className = cls; d.style.cssText = css; d.innerHTML = html; p.appendChild(d); return d; };
const fmt = (v, dec = 0) => { const [i, d] = Math.abs(v).toFixed(dec).split('.'); return (v < 0 ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (d ? ',' + d : ''); };
const cnt = (b0, b1, to, dec) => fmt(to * VP.eOut(ramp(b0, b1, x => x)), dec);
const show = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden'; };
const rollK = (r, k) => VP.roll(r.firstElementChild, k, r.offsetHeight);
const pop = (el, k, y = 60, s0 = .92) => { el.style.transform = `translateY(${((1 - k) * y).toFixed(2)}px) scale(${lerp(s0, 1, k).toFixed(4)})`; el.style.opacity = clamp(k * 5).toFixed(3); show(el, k > .002); };
/* one-line text that rolls in: rl(parent, css(position/size), html, innerCss) */
const rl = (p, css, html, inner = '') => mk(p, css, `<div style="${inner}">${html}</div>`, 'roll');
/* word-by-word headline; word starting with * gets the accent gradient (or *t* teal) */
const words = (p, css, text, cls = 'hd') => mk(p, css, text.split(' ').map(w => { if (w === '|') return '<br>'; const c = w[0] === '*' ? 'grad' : w[0] === '~' ? 'teal' : ''; return `<span class="mask"><span class="${c}">${w.replace(/^[*~]/, '')}</span></span>`; }).join(' '), cls);
const wordsAnim = (d, b0, step, out = 0) => d.querySelectorAll('.mask>span').forEach((w, k) => { const v = sp(b0 + k * step, ...SPR.POP); w.style.transform = `translateY(${((1 - v) * 135 - out * 135).toFixed(2)}%)`; });
const tri = c => `<svg width="30" height="26" viewBox="0 0 30 26" style="margin-right:12px"><path d="M15 2 L28 24 H2 Z" fill="${c}"/></svg>`;
const glow = (el, cx, cy, R, op) => { el.style.cssText += `;left:${(cx - R).toFixed(1)}px;top:${(cy - R).toFixed(1)}px;width:${(2 * R).toFixed(1)}px;height:${(2 * R).toFixed(1)}px;opacity:${op.toFixed(3)}`; };

/* ---------- data + voice-over anchors ---------- */
const D = window.DATA, WORDS = window.WORDS || {};
const dec = v => (String(v).split('.')[1] || '').length, F = v => fmt(v, dec(v)), P = v => '+' + F(v) + '%';
const nrm = w => w.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
/* beat range [start, end] of a phrase inside voice-over sentence k, from real word timestamps (tools/wordtimes.py) */
const phr = (k, text) => { const ws = WORDS[k] || [], tk = text.split(' ').map(nrm), n = tk.length;
  for (let i = 0; i + n <= ws.length; i++) if (tk.every((t, j) => nrm(ws[i + j][0]) === t)) return [V[k] + ws[i][1] / B, V[k] + ws[i + n - 1][2] / B];
  console.error('phrase not found:', k, text); return [V[k], V[k] + 3]; };
const T = { s1num: phr('s1a', 'chín phẩy không một phần trăm'), s1q3: phr('s1b', 'gần mười phần trăm'), s2cn: phr('s2', 'mười một phẩy hai mươi mốt'),
  s3inv: phr('s3', 'mười lăm phẩy một phần trăm'), s3cr: phr('s3', 'gần mười bảy phần trăm'), s3both: phr('s3', 'Cả hai đều nhanh hơn'),
  s4xk: phr('s4', 'hai mươi bốn phẩy năm phần trăm'), s4nk: phr('s4', 'ba mươi sáu phẩy bảy phần trăm'), s4def: phr('s4', 'gần hai mươi tỷ đô la'),
  s5a: phr('s5', 'Tám mươi phần trăm'), s5b: phr('s5', 'chín mươi bốn phần trăm'),
  s6q: phr('s6', 'Còn người lao động'), s6inc: phr('s6', 'chín phẩy một phần trăm'), s6cpi: phr('s6', 'trừ lạm phát'), s6real: phr('s6', 'bốn phẩy bốn'),
  s7v: phr('s7', 'vốn'), s7c: phr('s7', 'tín dụng'), s7n: phr('s7', 'nhập khẩu'), s7e: phr('s7', 'còn nhanh hơn'),
  s8: [phr('s8', 'Vậy mỗi một phần trăm'), phr('s8', 'vốn và tín dụng'), phr('s8', 'Tạo ra bao nhiêu'), phr('s8', 'năng suất'), phr('s8', 'Và để lại bao nhiêu'), phr('s8', 'thu nhập thực')] };
T.s8end = phr('s8', 'cho người dân')[1];

/* ---------- scenes ---------- */
const BG = { s1: C.ink, s2: C.paper, s3: C.ink, s4: C.paper, s5: C.ink, s6: C.paper, s7: C.ink, s8: C.paper };
const DARK = id => BG[id] === C.ink;
const SC = SPEC.scenes.map(([id, start, inn], i, all) => ({ id, start, in: inn, i, end: all[i + 1] ? all[i + 1][1] : SPEC.dur }));
const BUILD = {}, ANIM = {};

/* ===== S1 — Mở: 9,01% ===== */
BUILD.s1 = el => { const r = {};
  r.b1 = mk(el, 'background:radial-gradient(closest-side,rgba(255,150,40,.62),rgba(255,150,40,0))', '', 'a');
  r.b2 = mk(el, 'background:radial-gradient(closest-side,rgba(255,80,50,.5),rgba(255,80,50,0))', '', 'a');
  r.grp = mk(el, 'left:0;top:660px;width:1080px;height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px', '', 'a');
  r.kick = rl(r.grp, 'height:56px;width:1080px', '9 tháng năm 2026', `height:56px;line-height:56px;color:${C.mutedL}`); r.kick.firstElementChild.className = 'kick'; r.kick.firstElementChild.style.fontSize = '44px';
  r.title = words(r.grp, 'font-size:150px;text-align:center;width:900px', 'Kinh tế | Việt Nam');
  r.num = mk(el, 'left:0;top:780px;width:1080px;height:310px;text-align:center;font-size:300px;visibility:hidden', '', 'a num grad');
  r.sub = rl(el, 'left:0;top:1100px;width:1080px;height:90px;position:absolute', 'Tăng trưởng GDP thực', `font-size:56px;font-weight:600;text-align:center;color:#C9CCD4;line-height:90px`);
  r.pill = mk(el, 'left:160px;top:1330px;width:760px;height:170px;border-radius:85px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);display:flex;align-items:center;justify-content:space-between;padding:0 56px;visibility:hidden',
    `<div style="font-size:38px;font-weight:600;letter-spacing:.14em;color:#C9CCD4;display:flex;align-items:center">${tri('#FFB020')}QUÝ III</div><div class="num grad" style="font-size:104px"></div>`, 'a');
  r.q3 = r.pill.querySelector('.num');
  return r; };
ANIM.s1 = (s, b) => { const r = s.r, t = b * B;
  const g = sp(0, ...SPR.HEAVY), lit = .22 + .78 * sp(T.s1num[0] - .9, 1.4, .9);
  glow(r.b1, 260 + Math.sin(t * .9) * 40, 1060, 900 * g, lit); glow(r.b2, 840, 1250 + Math.cos(t * .8) * 40, 720 * g, lit);
  const [ty, sc] = VP.track([[0, [0, 1]], [T.s1num[0] - 1.0, [-460, .6], 1.5, .85]]);
  r.grp.style.transform = `translateY(${ty.toFixed(2)}px) scale(${sc.toFixed(4)})`;
  rollK(r.kick, sp(.4, ...SPR.SNAP)); wordsAnim(r.title, 1.0, .45);
  show(r.num, b >= T.s1num[0] - .9);
  r.num.textContent = cnt(T.s1num[0], T.s1num[1] + .3, D.gdp, dec(D.gdp)) + '%';
  r.num.style.transform = `scale(${lerp(.86, 1, sp(T.s1num[0] - .9, ...SPR.POP)).toFixed(4)})`; r.num.style.fontVariationSettings = `'wdth' ${lerp(125, 100, sp(T.s1num[0] - .9, 1.6, .7)).toFixed(1)}`;
  rollK(r.sub, sp(T.s1num[0] + .6, ...SPR.SNAP));
  pop(r.pill, sp(T.s1q3[0] - .4, ...SPR.POP), 80, .9); r.q3.textContent = '+' + cnt(T.s1q3[0], T.s1q3[1] + .3, D.q3, dec(D.q3)) + '%'; };

/* ===== S2 — Theo khu vực ===== */
const S2ROWS = [['Công nghiệp và xây dựng', D.sector.cnxd, true], ['Dịch vụ', D.sector.dv], ['Nông, lâm nghiệp và thủy sản', D.sector.nlts]];
const S2K = 640 / 12, S2X = 60, S2Y = [640, 910, 1180];
BUILD.s2 = el => { const r = { rows: [] };
  r.kick = rl(el, 'left:0;top:220px;width:1080px;height:56px;position:absolute', 'Tăng trưởng theo khu vực', `height:56px;line-height:56px;color:${C.mutedD}`); r.kick.firstElementChild.className = 'kick';
  r.title = words(el, 'left:60px;top:292px;width:960px;font-size:100px;text-align:center', 'Ai kéo *tăng *trưởng?', 'a hd');
  S2ROWS.forEach(([lab, val, hot], i) => { const y = S2Y[i], o = {};
    o.lab = rl(el, `left:${S2X}px;top:${y}px;width:960px;height:64px;position:absolute`, lab, `font-size:42px;font-weight:600;line-height:64px;color:#3A3D45`);
    o.trk = mk(el, `left:${S2X}px;top:${y + 80}px;width:960px;height:90px;border-radius:45px;background:rgba(16,18,24,.06)`, '', 'a');
    o.bar = mk(el, `left:${S2X}px;top:${y + 80}px;width:0;height:90px;border-radius:45px;background:${hot ? GR90 : C.dk}`, '', 'a');
    o.val = mk(el, `top:${y + 80}px;height:90px;line-height:90px;font-size:88px;${hot ? '' : `color:${C.dk}`}`, '', 'a num' + (hot ? ' grad' : ''));
    r.rows.push(o); });
  const lx = S2X + D.gdp * S2K;
  r.line = mk(el, `left:${lx}px;top:600px;width:0;height:760px;border-left:3px dashed rgba(16,18,24,.4);transform-origin:top`, '', 'a');
  r.gdp = rl(el, `left:${lx - 150}px;top:536px;width:300px;height:56px;position:absolute`, 'GDP ' + F(D.gdp) + '%', `height:56px;line-height:56px;text-align:center;font-weight:700;font-size:30px;letter-spacing:.06em;color:#fff;background:${C.dk};border-radius:28px`);
  r.cap = rl(el, 'left:60px;top:1440px;width:960px;height:140px;position:absolute', 'Chỉ công nghiệp và xây dựng vượt mức tăng chung', `font-size:46px;font-weight:600;line-height:1.3;color:#3A3D45;white-space:normal;text-align:center`);
  return r; };
ANIM.s2 = (s, b) => { const r = s.r;
  rollK(r.kick, sp(16.6, ...SPR.SNAP)); wordsAnim(r.title, 16.8, .22);
  r.rows.forEach((o, i) => { const t0 = 17.4 + i * .45, [, val] = S2ROWS[i], w = val * S2K * sp(t0 + .1, ...SPR.GLIDE);
    rollK(o.lab, sp(t0, ...SPR.SNAP)); o.bar.style.width = Math.max(0, w).toFixed(1) + 'px'; show(o.trk, b > t0 - .1); show(o.bar, b > t0);
    o.val.textContent = cnt(t0 + .3, i === 0 ? T.s2cn[1] + .3 : t0 + 3.1, val, dec(val)) + '%'; o.val.style.left = (S2X + w + 28).toFixed(1) + 'px'; show(o.val, b > t0 + .15); });
  const l = sp(20.7, ...SPR.SNAP); r.line.style.transform = `scaleY(${clamp(l).toFixed(4)})`; r.line.style.width = '3px'; show(r.line, l > .01);
  rollK(r.gdp, sp(21.0, ...SPR.SNAP)); rollK(r.cap, sp(21.9, ...SPR.SNAP)); };

/* ===== S3 — Vốn, tín dụng, FDI (drop) ===== */
const S3CARDS = [['Tổng vốn đầu tư toàn xã hội', D.invest.abs, dec(D.invest.abs), 'nghìn tỷ đồng', P(D.invest.g), T.s3inv[0] - .9, 470, T.s3inv[1] + .3], ['Tín dụng', D.credit.abs, dec(D.credit.abs), 'triệu tỷ đồng', P(D.credit.g), T.s3cr[0] - .9, 800, T.s3cr[1] + .3], ['FDI thực hiện', D.fdi.abs, dec(D.fdi.abs), 'tỷ USD', P(D.fdi.g), T.s3both[0], 1130, 0]];
BUILD.s3 = el => { const r = { cards: [] };
  r.b1 = mk(el, 'background:radial-gradient(closest-side,rgba(255,110,50,.45),rgba(255,110,50,0))', '', 'a');
  r.kick = rl(el, 'left:0;top:196px;width:1080px;height:56px;position:absolute', '9 tháng 2026 · so với cùng kỳ', `height:56px;line-height:56px;color:${C.mutedL}`); r.kick.firstElementChild.className = 'kick';
  r.title = words(el, 'left:0;top:262px;width:1080px;font-size:190px;text-align:center', '*Nhưng', 'a hd');
  S3CARDS.forEach(([lab, val, dec, unit, chip, , y]) => { const o = {};
    o.card = mk(el, `left:60px;top:${y}px;width:960px;height:300px;border-radius:44px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12);visibility:hidden`, '', 'a');
    mk(o.card, 'left:52px;top:44px;font-size:28px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#A9AEB8;white-space:nowrap', lab, 'a');
    o.chip = mk(o.card, 'right:40px;top:28px;height:76px;padding:0 26px;border-radius:38px;background:' + GR + ';display:flex;align-items:center;color:#10131A', `${tri('#10131A')}<span class="num" style="font-size:48px">${chip}</span>`, 'a');
    const row = mk(o.card, 'left:52px;top:136px;display:flex;align-items:baseline;gap:20px', `<span class="num o" style="font-size:132px"></span><span style="font-size:42px;font-weight:600;color:#A9AEB8">${unit}</span>`, 'a');
    o.n = row.querySelector('.o'); r.cards.push(o); });
  r.ban = rl(el, 'left:60px;top:1500px;width:960px;height:110px;position:absolute', `Đều nhanh hơn tốc độ tăng GDP <span class="grad">${F(D.gdp)}%</span>`, 'font-size:44px;font-weight:700;line-height:110px;text-align:center;color:#fff;border-radius:55px;box-shadow:inset 0 0 0 2px rgba(255,176,32,.7)');
  return r; };
ANIM.s3 = (s, b) => { const r = s.r;
  const g = sp(23, ...SPR.HEAVY); glow(r.b1, 540, 700, 980 * g, .9 * Math.min(1, g));
  rollK(r.kick, sp(23.6, ...SPR.SNAP)); wordsAnim(r.title, 23.7, .2);
  r.cards.forEach((o, i) => { const [, val, dc, , , t0, , ce] = S3CARDS[i]; pop(o.card, sp(t0, ...SPR.POP), 90, .94);
    o.n.textContent = cnt(t0 + .4, ce || t0 + 3.0, val, dc); pop(o.chip, sp(ce ? ce - .5 : t0 + 2.4, ...SPR.POP), 24, .85); });
  rollK(r.ban, sp(T.s3both[1], ...SPR.SNAP)); };

/* ===== S4 — Xuất khẩu / nhập khẩu ===== */
const S4BASE = 1430, S4K = 780 / 460, S4XK = D.export.abs, S4NK = D.import.abs;
BUILD.s4 = el => { const r = {};
  r.kick = rl(el, 'left:0;top:196px;width:1080px;height:56px;position:absolute', 'Xuất – nhập khẩu · 9 tháng 2026', `height:56px;line-height:56px;color:${C.mutedD}`); r.kick.firstElementChild.className = 'kick';
  r.title = words(el, 'left:60px;top:262px;width:960px;font-size:74px;text-align:center', 'Xuất khẩu mạnh, | nhập khẩu còn *mạnh *hơn', 'a hd');
  const bar = (x, h0, bg, col, val, lab, chip, chipBg, chipCol) => { const o = {};
    o.bar = mk(el, `left:${x}px;width:330px;border-radius:30px 30px 0 0;background:${bg};color:${col};overflow:hidden;visibility:hidden`, `<div style="padding-top:28px;text-align:center"><div class="num o" style="font-size:80px"></div><div style="font-size:34px;font-weight:600;opacity:.8;margin-top:6px">tỷ USD</div></div>`, 'a');
    o.n = o.bar.querySelector('.o');
    o.lab = rl(el, `left:${x}px;top:${S4BASE + 20}px;width:330px;height:64px;position:absolute`, lab, 'font-size:46px;font-weight:700;line-height:64px;text-align:center');
    o.chip = mk(el, `left:${x + 15}px;top:${S4BASE + 100}px;width:300px;height:96px;border-radius:48px;background:${chipBg};color:${chipCol};display:flex;align-items:center;justify-content:center;visibility:hidden`, `${tri(chipCol)}<span class="num" style="font-size:56px">${chip}</span>`, 'a');
    return o; };
  r.xk = bar(130, 0, C.dk, '#fff', S4XK, 'Xuất khẩu', P(D.export.g), C.dk, '#fff');
  r.nk = bar(620, 0, GR, '#10131A', S4NK, 'Nhập khẩu', P(D.import.g), GR, '#10131A');
  r.base = mk(el, `left:60px;top:${S4BASE}px;width:960px;height:3px;background:rgba(16,18,24,.25);transform-origin:left`, '', 'a');
  const yx = S4BASE - S4XK * S4K;
